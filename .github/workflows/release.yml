name: Build Windows app

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create and attach the installers to (for example v0.1.0). Leave empty to only build.'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: VectorEdit-windows
          path: |
            release/VectorEdit-Setup-*.exe
            release/VectorEdit-Portable-*.exe
          if-no-files-found: error
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release/VectorEdit-Setup-*.exe
            release/VectorEdit-Portable-*.exe
